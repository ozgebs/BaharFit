<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5f2"><title>BaharFit · Antrenman Günlüğüm</title><style>
:root{--bg:#f8f5f2;--paper:#fff;--ink:#282521;--muted:#827d77;--brand:#8b5e83;--soft:#f2e7ef;--mint:#e4efe6;--line:#eee7e3;--danger:#b04750}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:22px 17px 108px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.brand{font-weight:850;font-size:26px;letter-spacing:-1.3px}.brand i{color:var(--brand);font-style:normal}.sub{font-size:12px;color:var(--muted);margin-top:3px}.avatar{height:45px;width:45px;border-radius:16px;background:#e9d8e4;display:grid;place-items:center;font-size:23px}.hero{background:linear-gradient(125deg,#8a5d80,#ab819b);padding:22px;color:white;border-radius:24px;margin-bottom:19px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:22px;top:8px;font-size:105px;opacity:.10}.eyebrow{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}.hero h1{font-size:25px;line-height:1.22;max-width:340px;letter-spacing:-.8px;margin:10px 0}.hero p{font-size:13px;margin:0;opacity:.92;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}.stat{background:white;border-radius:17px;padding:14px 10px;border:1px solid var(--line)}.stat strong{display:block;font-size:21px;letter-spacing:-.7px}.stat span{font-size:11px;color:var(--muted)}h2{font-size:19px;margin:25px 0 12px;letter-spacing:-.4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.small{font-size:12px;color:var(--muted)}.primary,.secondary,.tiny{border:0;border-radius:13px;padding:13px 16px;font-weight:730}.primary{background:var(--brand);color:white}.secondary{background:var(--soft);color:var(--brand)}.tiny{padding:8px 11px;background:#f4f0ed;color:var(--ink);font-size:12px}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px;min-width:0}.exercise{cursor:pointer}.visual{height:96px;border-radius:14px;background:linear-gradient(145deg,#f1e7ef,#f8f4f4);display:grid;place-items:center;margin-bottom:12px}.visual svg{height:79px;width:125px}.exname{font-size:15px;font-weight:750;line-height:1.3}.pill{font-size:11px;background:#ebf3ec;color:#48735a;border-radius:20px;padding:5px 8px;white-space:nowrap}.muted{color:var(--muted)}.progress{height:7px;border-radius:10px;background:#efe8ec;overflow:hidden;margin:11px 0 7px}.progress>div{height:100%;background:var(--brand);border-radius:10px}.exmeta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(12px)}.nav button{color:var(--muted);background:none;border:0;display:grid;gap:4px;place-items:center;font-size:10px;min-width:60px;padding:4px}.nav button b{font-size:21px;font-weight:400}.nav button.on{color:var(--brand);font-weight:800}.hidden{display:none!important}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:11px 0 5px}input,select{width:100%;min-width:0;padding:13px 11px;border:1px solid #dfd7d4;border-radius:12px;background:#fff;color:var(--ink)}input[type="date"]{min-height:45px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.formgrid.two{grid-template-columns:1fr 1fr}.formgrid label{margin-top:12px}.entry{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.entryhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750}.entrybutton{background:none;border:0;color:var(--danger);font-size:12px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 35px;gap:7px;align-items:center;margin-top:8px}.setrow input{padding:10px 8px}.setrow span{font-size:12px;color:var(--muted)}.unit{font-size:11px;color:var(--muted)}.chart{display:flex;align-items:end;gap:6px;height:140px;padding:18px 5px 20px;border-bottom:1px solid var(--line)}.bar{background:#c8a3be;border-radius:6px 6px 0 0;flex:1;min-width:8px;position:relative}.bar:last-child{background:var(--brand)}.bar:hover:after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:0;background:#322a30;color:white;padding:5px;border-radius:5px;font-size:10px;white-space:nowrap}.history{display:grid;gap:9px}.histitem{background:white;border:1px solid var(--line);padding:14px;border-radius:16px}.tag{display:inline-block;background:#f1e8ed;border-radius:8px;padding:4px 8px;font-size:11px;color:var(--brand)}.notice{padding:13px;border-radius:14px;background:#f4eee9;color:#715b4c;font-size:12px;line-height:1.5;margin:15px 0}.empty{padding:35px 12px;text-align:center;color:var(--muted);background:white;border:1px dashed #d9cdd2;border-radius:18px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}.flex{display:flex;align-items:center;gap:8px}.danger{color:var(--danger)}.back{background:none;border:0;color:var(--brand);padding:6px 0 15px;font-weight:750}.caption{font-size:12px;line-height:1.5;color:var(--muted)}.note{font-size:12px;line-height:1.5;background:#f7f3f6;padding:12px;border-radius:12px}.goals{display:grid;gap:10px}.goal{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center}.goal input{text-align:right}.detailTitle{display:flex;align-items:center;gap:12px}.detailTitle .visual{width:120px;min-width:120px;margin:0}.detailTitle .visual svg{width:100px}.dataActions{display:flex;flex-wrap:wrap;gap:8px}.dataActions button{flex:1}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:16px}.legend{font-size:12px;color:var(--muted);margin-top:9px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.visual{height:112px}main{padding-top:32px}}
</style></head><body><main><header class="top"><div><div class="brand">bahar<i>fit</i> <span style="font-size:15px">✳</span></div><div class="sub">Benim güçlenme günlüğüm</div></div><div class="avatar">🏋🏻‍♀️</div></header><section id="home"></section><section id="workout" class="hidden"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section><section id="detail" class="hidden"></section></main><nav class="nav" id="nav"><button data-tab="home" class="on"><b>⌂</b>Ana sayfa</button><button data-tab="workout"><b>＋</b>Antrenman</button><button data-tab="history"><b>▥</b>Geçmiş</button><button data-tab="settings"><b>⚙</b>Ayarlar</button></nav><input type="file" id="restoreInput" accept=".json,application/json" style="display:none"><script>
'use strict';
const KEY='baharfit_data_v1';
const baseExercises=[
['hip','Hip Thrust','Kalça',25,50,'hip'],['press','Leg Press','Bacak',30,70,'press'],['smith','Smith Squat','Bacak',10,40,'squat'],['rdl','Romanian Deadlift','Arka bacak',20,40,'hinge'],['curl','Leg Curl','Arka bacak',10,25,'curl'],['abd','Abductor (Dış bacak)','Kalça',35,55,'abduct'],['add','Adductor (İç bacak)','İç bacak',35,55,'abduct'],['ext','Leg Extension','Ön bacak',10,20,'extend'],['chest','Göğüs Açma / Pec Deck','Göğüs',15,30,'chest'],['arm','Kol Açma / Makine','Kol',20,30,'chest'],['triceps','Triceps / Arka Kol','Arka kol',20,30,'arm'],['pulldown','Kablo / İp Çekme','Sırt',10,25,'pull'],['plank','Plank','Karın',0,0,'plank']
].map(([id,name,group,baseline,goal,icon])=>({id,name,group,baseline,goal,icon}));
// Older entries are reconstructed from the user's earlier logs; some exercises have no set-by-set detail.
const seed=[
['2026-09-26',[['hip',20,12,3],['press',30,12,1],['curl',10,12,3],['rdl',20,12,3],['triceps',20,10,3],['abd',30,12,3],['add',30,12,3]]],
['2026-10-03',[['hip',25,10,2],['hip',25,12,1],['press',30,12,3],['rdl',20,10,3],['abd',35,15,3],['add',35,15,3]]],
['2026-10-06',[['hip',25,12,3],['rdl',15,12,3],['curl',10,12,3],['abd',35,12,3],['add',35,12,3],['pulldown',10,12,3]]],
['2026-10-08',[['hip',25,10,3],['press',30,12,3],['rdl',15,12,3],['curl',10,12,3],['abd',35,12,3],['add',35,12,3],['arm',15,12,3]]],
['2026-10-13',[['hip',25,12,3],['press',30,12,3],['rdl',20,8,3],['curl',10,12,3],['abd',35,15,3],['add',35,15,3],['smith',10,8,3],['chest',15,12,3],['arm',20,8,3]]],
['2026-10-15',[['hip',25,12,3],['ext',10,6,3]]]
].map(([date,entries],i)=>({id:'historical'+i,date,note:'Önceki sohbetlerden aktarılan kayıt (yalnızca bildirilen hareketler).',entries:entries.flatMap(([eid,kg,reps,count])=>Array.from({length:count},()=>({eid,kg,reps})))}));
const fresh=()=>({exercises:structuredClone(baseExercises),sessions:structuredClone(seed),targetDate:'2027-04-01'});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(db.exercises)||!Array.isArray(db.sessions))throw Error('invalid')}catch{db=fresh()}
let draft=null;let selected=null;let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Kayıt telefonda saklanamadı: '+e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateTR(d){if(!d)return '';const [y,m,day]=d.split('-');return `${day}.${m}.${y}`}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function latestSession(eid){return [...db.sessions].filter(s=>s.entries.some(x=>x.eid===eid)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))[0]}
function maxkg(s,eid){return Math.max(0,...(s?.entries||[]).filter(x=>x.eid===eid).map(x=>Number(x.kg)||0))}
function progress(e){if(!e.goal)return 0;return Math.max(0,Math.min(100,Math.round(100*maxkg(latestSession(e.id),e.id)/e.goal)))}
function icon(kind){const common='<g stroke="#7d5877" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="43" cy="19" r="9" fill="#cba4bf" stroke="none"/><path d="M42 29L52 52 72 56M48 39L26 53"/><path d="M51 51L37 74M69 56L86 75"/></g>';const shapes={hip:'<path d="M16 77H112M31 77V57H97V77M48 51H87M25 46H105"/>',press:'<path d="M15 80L96 19M52 71L103 20M76 18H113V53"/>',squat:'<path d="M15 13V85M111 13V85M15 32H111M15 75H111"/>',hinge:'<path d="M18 80H111M33 66H90M33 59V73M90 59V73"/>',curl:'<path d="M16 61H104M26 61V83M95 61V83M83 37L107 58"/>',abduct:'<path d="M18 80H109M63 35V76M31 75L62 52 99 74"/>',extend:'<path d="M19 48H73V59H19M28 59V83M74 58L106 58"/>',chest:'<path d="M21 17V82M108 17V82M20 40L49 52 67 52 108 40"/>',arm:'<path d="M19 20V83M103 20V83M19 33H103M23 49H46M78 49H102"/>',pull:'<path d="M11 14H116M62 14V56M31 27L62 43 94 27"/>',plank:'<path d="M12 72H114M19 61L109 52"/>'};return `<svg viewBox="0 0 128 95" role="img" aria-label="Hareket simgesi"><g stroke="#d1b9ca" fill="none" stroke-width="5" stroke-linecap="round">${shapes[kind]||shapes.squat}</g>${common}</svg>`}
function show(t){tab=t;for(const name of ['home','workout','history','settings','detail'])document.getElementById(name).classList.toggle('hidden',name!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));document.getElementById('nav').style.display=t==='detail'?'none':'flex';render();window.scrollTo(0,0)}
function render(){if(tab==='home')renderHome();if(tab==='workout')renderWorkout();if(tab==='history')renderHistory();if(tab==='settings')renderSettings();if(tab==='detail')renderDetail()}
function renderHome(){const count=db.sessions.length, all=db.exercises.filter(e=>latestSession(e.id));const best=all.filter(e=>e.goal>0);const avg=best.length?Math.round(best.reduce((a,e)=>a+progress(e),0)/best.length):0;document.getElementById('home').innerHTML=`<div class="hero"><div class="eyebrow">Kendinle yarış ✨</div><h1>Güçleniyorsun. Her tekrarın kayıtta.</h1><p>Hedef tarihi: ${dateTR(db.targetDate)} · Ağırlıklarını düzenli kaydet, ilerlemeni gör.</p></div><div class="stats"><div class="stat"><strong>${count}</strong><span>kayıtlı antrenman</span></div><div class="stat"><strong>${all.length}</strong><span>çalışılan hareket</span></div><div class="stat"><strong>%${avg}</strong><span>ortalama hedef ilerlemesi*</span></div></div><div class="row"><h2>Hareketlerim</h2><button class="tiny" onclick="show('settings')">＋ Hareket ekle</button></div><div class="grid">${db.exercises.map(e=>{const prev=latestSession(e.id),kg=maxkg(prev,e.id);return `<article class="card exercise" onclick="openDetail('${esc(e.id)}')"><div class="visual">${icon(e.icon)}</div><div class="exname">${esc(e.name)}</div><div class="small" style="margin-top:5px">${esc(e.group)}</div><div class="row" style="margin-top:11px"><b>${prev?(e.id==='plank'?kg+' sn':kg+' kg'):'—'}</b><span class="small">${e.goal?'hedef '+e.goal+' kg':'süre hedefi yok'}</span></div><div class="progress"><div style="width:${progress(e)}%"></div></div><div class="exmeta"><span>${prev?dateTR(prev.date):'Henüz kayıt yok'}</span><span>${e.goal?'%'+progress(e):'—'}</span></div></article>`}).join('')}</div><p class="caption">* İlerleme, hedefi olan ve kaydı bulunan hareketlerde son kaydedilen en yüksek ağırlığın Nisan hedef ağırlığına oranıdır. Tekrar kalitesi ve toplam hacim ayrı değerlendirilir. Çizimler hareketleri simgeler; teknik eğitim yerine geçmez.</p><button class="primary full" onclick="show('workout')" style="margin-top:12px">＋ Yeni antrenman kaydet</button>`}
function ensureDraft(){if(!draft)draft={date:today(),note:'',entries:[]}}
function renderWorkout(){ensureDraft();document.getElementById('workout').innerHTML=`<div class="row"><h2>Antrenman kaydı</h2><span class="tag">${draft.entries.length} set</span></div><div class="card"><label>Tarih</label><input id="workdate" type="date" value="${draft.date}" onchange="draft.date=this.value"><label>Hareket seç</label><select id="addExercise"><option value="">Hareket seç...</option>${db.exercises.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select><button class="secondary full" style="margin-top:10px" onclick="addSet()">＋ Set ekle</button></div>${draft.entries.length?`<h2>Bugünkü setler</h2>`:''}${[...new Set(draft.entries.map(x=>x.eid))].map(eid=>{const e=db.exercises.find(x=>x.id===eid);if(!e)return '';const indices=draft.entries.map((x,i)=>x.eid===eid?i:-1).filter(i=>i>=0);return `<div class="entry"><div class="entryhead"><span>${esc(e.name)}</span><button class="entrybutton" onclick="removeMovement('${esc(eid)}')">Hareketi kaldır</button></div><div class="setrow"><span></span><span class="unit">KG / saniye</span><span class="unit">Tekrar</span><span></span></div>${indices.map((i,n)=>`<div class="setrow"><span>${n+1}.</span><input aria-label="Ağırlık" type="number" min="0" step="0.5" value="${draft.entries[i].kg}" oninput="draft.entries[${i}].kg=Number(this.value)"><input aria-label="Tekrar" type="number" min="1" step="1" value="${draft.entries[i].reps}" oninput="draft.entries[${i}].reps=Number(this.value)"><button class="tiny" onclick="removeSet(${i})">×</button></div>`).join('')}<button class="tiny" style="margin-top:10px" onclick="addSet('${esc(eid)}')">＋ Aynı hareketten set</button></div>`}).join('')}<div class="card"><label>Notlar (isteğe bağlı)</label><input id="worknote" placeholder="Örn. Hip thrust bugün daha kolaydı" value="${esc(draft.note)}" oninput="draft.note=this.value"><button class="primary full" style="margin-top:14px" onclick="saveWorkout()">Antrenmanı kaydet</button><button class="tiny full" style="margin-top:8px" onclick="if(confirm('Bu taslağı temizleyelim mi?')){draft=null;renderWorkout()}">Taslağı temizle</button></div><p class="caption">Önceki antrenmanla karşılaştırma, kaydetme sonrasında Geçmiş ve hareket detayında görünür.</p>`}
function addSet(eid){ensureDraft();eid=eid||document.getElementById('addExercise')?.value;if(!eid){alert('Önce hareket seç.');return}const last=[...draft.entries].reverse().find(e=>e.eid===eid)||latestSession(eid)?.entries.filter(e=>e.eid===eid).at(-1);draft.entries.push({eid,kg:last?.kg??0,reps:last?.reps??12});renderWorkout()}
function removeSet(i){draft.entries.splice(i,1);renderWorkout()}
function removeMovement(eid){draft.entries=draft.entries.filter(x=>x.eid!==eid);renderWorkout()}
function saveWorkout(){if(!draft.entries.length){alert('En az bir set ekle.');return}if(!draft.date){alert('Tarih seç.');return}if(draft.entries.some(x=>!Number.isFinite(x.kg)||x.kg<0||!Number.isFinite(x.reps)||x.reps<1)){alert('Set değerlerini kontrol et.');return}db.sessions.push({id:'s'+Date.now(),date:draft.date,note:draft.note,entries:structuredClone(draft.entries)});save();draft=null;show('history')}
function sessionComparison(s){const previous=db.sessions.filter(x=>x.id!==s.id&&x.date<=s.date).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));const parts=[];for(const eid of [...new Set(s.entries.map(x=>x.eid))]){const e=db.exercises.find(x=>x.id===eid);const prior=previous.find(x=>x.entries.some(z=>z.eid===eid));if(!e||!prior)continue;const curr=maxkg(s,eid),old=maxkg(prior,eid),delta=curr-old;const v1=s.entries.filter(x=>x.eid===eid).reduce((a,x)=>a+x.kg*x.reps,0),v0=prior.entries.filter(x=>x.eid===eid).reduce((a,x)=>a+x.kg*x.reps,0);parts.push(`<div class="small" style="margin-top:7px"><b>${esc(e.name)}</b> · en yüksek ağırlık ${delta>0?'+':''}${fmt(delta)} kg ${delta>0?'↑':delta<0?'↓':'→'} · hacim ${v0?((v1-v0)/v0*100>0?'+':'')+Math.round((v1-v0)/v0*100)+'%':'—'}</div>`)}return parts.join('')||'<span class="small">Karşılaştırma yapılacak önceki kayıt yok.</span>'}
function fmt(n){return Number(n).toLocaleString('tr-TR',{maximumFractionDigits:1})}
function renderHistory(){const sessions=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));document.getElementById('history').innerHTML=`<div class="row"><h2>Gelişim geçmişim</h2><span class="small">${sessions.length} kayıt</span></div><p class="caption">Karşılaştırma her harekette bu tarihten önceki son kayıtla yapılır. Hacim = ağırlık × tekrar sayılarının setler boyunca toplamı.</p><div class="history">${sessions.map(s=>`<article class="histitem"><div class="row"><strong>${dateTR(s.date)}</strong><button class="entrybutton" onclick="deleteSession('${esc(s.id)}')">Sil</button></div><div class="small" style="margin:6px 0">${s.entries.length} set · ${new Set(s.entries.map(x=>x.eid)).size} hareket</div><div style="margin:9px 0">${[...new Set(s.entries.map(x=>x.eid))].map(eid=>{const e=db.exercises.find(x=>x.id===eid),xs=s.entries.filter(x=>x.eid===eid);return `<span class="tag" style="margin:3px 4px 3px 0">${esc(e?.name||'Silinen hareket')}: ${fmt(Math.max(...xs.map(x=>x.kg)))} kg · ${xs.length} set</span>`}).join('')}</div><div class="note">${sessionComparison(s)}</div>${s.note?`<p class="caption">${esc(s.note)}</p>`:''}</article>`).join('')}</div>`}
function deleteSession(id){if(!confirm('Bu antrenman kaydı silinsin mi?'))return;db.sessions=db.sessions.filter(s=>s.id!==id);save();renderHistory()}
function openDetail(id){selected=id;show('detail')}
function renderDetail(){const e=db.exercises.find(x=>x.id===selected);if(!e){show('home');return}const points=db.sessions.filter(s=>s.entries.some(x=>x.eid===e.id)).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({date:s.date,kg:maxkg(s,e.id),vol:s.entries.filter(x=>x.eid===e.id).reduce((a,x)=>a+x.kg*x.reps,0),reps:s.entries.filter(x=>x.eid===e.id).map(x=>x.reps).join('/')}));const max=Math.max(1,e.goal,...points.map(p=>p.kg));const recent=points.at(-1),prior=points.at(-2),delta=recent&&prior?recent.kg-prior.kg:null;document.getElementById('detail').innerHTML=`<button class="back" onclick="show('home')">← Hareketlerime dön</button><div class="detailTitle"><div class="visual">${icon(e.icon)}</div><div><div class="small">${esc(e.group)}</div><h2 style="margin:5px 0">${esc(e.name)}</h2><div class="small">Nisan hedefi ${e.goal?fmt(e.goal)+' kg':'belirlenmedi'}</div></div></div><div class="stats"><div class="stat"><strong>${recent?fmt(recent.kg):'—'}</strong><span>son ağırlık (kg)</span></div><div class="stat"><strong>${delta===null?'—':(delta>0?'+':'')+fmt(delta)}</strong><span>önceki kayda göre kg</span></div><div class="stat"><strong>%${progress(e)}</strong><span>hedef oranı</span></div></div><h2>Gelişim grafiği</h2><div class="card"><div class="small">Antrenman bazında en yüksek ağırlık (kg)</div>${points.length?`<div class="chart">${points.map(p=>`<div class="bar" style="height:${Math.max(4,p.kg/max*100)}%" title="${dateTR(p.date)}: ${fmt(p.kg)} kg" data-tip="${dateTR(p.date)} ${fmt(p.kg)} kg"></div>`).join('')}</div><div class="row legend"><span>${dateTR(points[0].date)}</span><span>${dateTR(points.at(-1).date)}</span></div>`:'<div class="empty">Bu hareket için henüz kayıt yok.</div>'}</div><h2>Hareket kayıtları</h2>${points.slice().reverse().map(p=>`<div class="histitem" style="margin:8px 0"><div class="row"><b>${dateTR(p.date)}</b><strong>${fmt(p.kg)} kg</strong></div><div class="small">Tekrarlar: ${esc(p.reps)} · Toplam hacim: ${fmt(p.vol)} kg-tekrar</div></div>`).join('')}<button class="secondary full" onclick="show('settings')" style="margin-top:13px">Hedef ağırlığı düzenle</button>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<h2>Hedefler ve hareketler</h2><div class="card"><label>Nisan hedef tarihi</label><input type="date" value="${esc(db.targetDate)}" onchange="db.targetDate=this.value;save()"><p class="caption">Hedef ağırlıklarını dilediğin zaman değiştirebilirsin. Buradaki sayılar örnek başlangıç hedefleridir; spor geçmişine ve hareket tekniğine göre kişiselleştir.</p><div class="goals">${db.exercises.map(e=>`<div class="goal"><div><strong style="font-size:13px">${esc(e.name)}</strong><div class="small">${esc(e.group)} ${e.baseline?'· başlangıç '+e.baseline+' kg':''}</div></div><input aria-label="${esc(e.name)} hedef" type="number" min="0" step="0.5" value="${e.goal}" onchange="setGoal('${esc(e.id)}',this.value)"></div>`).join('')}</div></div><h2>Yeni alet / hareket</h2><div class="card"><label>Hareketin adı</label><input id="newName" placeholder="Örn. Lat Pulldown"><div class="formgrid two"><div><label>Kas grubu</label><select id="newGroup"><option>Kalça</option><option>Bacak</option><option>Sırt</option><option>Göğüs</option><option>Kol</option><option>Karın</option><option>Tüm vücut</option></select></div><div><label>Nisan hedefi (kg)</label><input id="newGoal" type="number" min="0" step="0.5" placeholder="30"></div></div><label>Görsel simge</label><select id="newIcon"><option value="squat">Squat / genel</option><option value="hip">Kalça kaldırma</option><option value="press">İtme</option><option value="hinge">Deadlift</option><option value="curl">Bacak bükme</option><option value="abduct">Bacak açma</option><option value="extend">Bacak uzatma</option><option value="chest">Göğüs</option><option value="arm">Kol</option><option value="pull">Çekme</option><option value="plank">Plank</option></select><button class="primary full" style="margin-top:15px" onclick="addExercise()">Hareketi ekle</button></div><h2>Verilerim</h2><div class="card"><div class="dataActions"><button class="secondary" onclick="downloadBackup()">↓ Yedek indir</button><button class="secondary" onclick="document.getElementById('restoreInput').click()">↑ Yedek yükle</button></div><p class="caption">Veriler bu cihazın tarayıcı belleğinde saklanır, bir hesaba veya sunucuya gönderilmez. Telefon değiştirirken ya da tarayıcı verilerini temizlemeden önce yedek indirmen gerekir.</p><hr><button class="tiny danger" onclick="if(confirm('Tüm kayıtları sıfırlamak istiyor musun?')){if(confirm('Son onay: tüm eklediğin kayıtlar silinecek.')){db=fresh();save();show('home')}}">Başlangıç verilerine sıfırla</button></div><p class="notice">Önceden konuştuğumuz bazı antrenmanlar başlangıç olarak eklendi. Eski kayıtlarda sadece bildirdiğin setler vardır; eksik bilgiler uydurulmadı. Hareket çizimleri semboliktir. Nisan 2027 hedeflerini kendi seviyene göre düzenle.</p>`}
function setGoal(id,v){const e=db.exercises.find(x=>x.id===id);if(e){e.goal=Math.max(0,Number(v)||0);save()}}
function addExercise(){const name=document.getElementById('newName').value.trim();if(!name){alert('Hareket adı yaz.');return}if(db.exercises.some(e=>e.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr'))){alert('Bu hareket zaten var.');return}db.exercises.push({id:'custom'+Date.now(),name,group:document.getElementById('newGroup').value,goal:Math.max(0,Number(document.getElementById('newGoal').value)||0),baseline:0,icon:document.getElementById('newIcon').value});save();renderSettings();alert('Hareket eklendi!')}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='baharfit-yedek-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('restoreInput').addEventListener('change',async function(){const file=this.files?.[0];if(!file)return;try{const candidate=JSON.parse(await file.text());if(!Array.isArray(candidate.exercises)||!Array.isArray(candidate.sessions))throw Error('Yedek biçimi geçersiz');if(!confirm('Yedekteki kayıtlar mevcut kayıtlarının yerine geçsin mi?'))return;db=candidate;save();show('home')}catch(err){alert('Yedek açılamadı: '+err.message)}finally{this.value=''}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));save();show('home');
</script></body></html>
